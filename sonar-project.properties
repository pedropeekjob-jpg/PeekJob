# SonarQube: qualidade e fiabilidade antes de entrar em main (ver docs/07-backend.md, "Qualidade")
sonar.projectKey=peekjob
sonar.projectName=PeekJob
sonar.sourceEncoding=UTF-8

sonar.sources=apps/web/src,apps/api/src,packages/shared/src
sonar.tests=apps/web/test,apps/api/test,packages/shared/test,e2e
sonar.exclusions=**/dist/**,**/*.d.ts,**/coverage/**

# Pontos de entrada e CLIs (corridos à mão, sem lógica própria) ficam fora da cobertura
sonar.coverage.exclusions=apps/web/src/main.tsx,apps/api/src/main.ts,apps/api/src/**/*-cli.ts

# Cobertura: unitários (web, API, shared) + testes no browser (web), juntos por linha
sonar.javascript.lcov.reportPaths=coverage/web-unit.lcov,coverage/web-e2e.lcov,coverage/api.lcov,coverage/shared.lcov
