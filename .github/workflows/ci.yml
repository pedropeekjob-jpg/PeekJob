name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/peekjob_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Testes do domínio partilhado
        run: npm test -w @peekjob/shared
      - name: Build do domínio partilhado
        run: npm run build -w @peekjob/shared
      - name: Testes da web (medição e privacidade)
        run: npm test -w @peekjob/web
      - name: Testes da API (unitários + integração com PostgreSQL)
        run: npm test -w @peekjob/api
      - name: Typecheck e build
        run: |
          npm run build -w @peekjob/api
          npm run build -w @peekjob/web

  browser:
    # Testes no browser (Playwright): a aplicação como em produção (API a servir a web) + PostgreSQL, telemóvel e computador
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/peekjob_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (web como em produção)
        run: npm run build:e2e
      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium
      - name: Testes no browser
        run: npm run e2e
      - name: Relatório (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    # Garante que a imagem de produção (API + web) constrói
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t peekjob:ci .

  deploy-demo:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w @peekjob/shared
      - name: Build da demo (GA opcional, variável GA_ID_DEMO no repositório)
        run: npm run build -w @peekjob/web
        env:
          VITE_GA_ID: ${{ vars.GA_ID_DEMO }}
          VITE_APP_VERSION: ${{ github.sha }}
      - name: Juntar imagens da documentação (usadas no Confluence)
        run: |
          mkdir -p apps/web/dist/docs
          cp -r docs/ecras docs/marca apps/web/dist/docs/
          touch apps/web/dist/.nojekyll
      - name: Publicar a demo no GitHub Pages (ramo gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist
          publish_branch: gh-pages
